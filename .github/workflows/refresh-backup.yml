# Keeps data/drugs-backup.js (the offline copy of the drug data) in step with the Google Sheet.
# Runs every Monday, and can be run any time from the repository's "Actions" tab.
name: Refresh drug backup

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, 06:17 UTC
  workflow_dispatch:        # the "Run workflow" button

permissions:
  contents: write           # lets the job save the updated file

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download the Sheet and rebuild the backup
        run: node scripts/refresh-backup.mjs
      - name: Save the file if it changed
        run: |
          if [ -n "$(git status --porcelain data/drugs-backup.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/drugs-backup.js
            git commit -m "Refresh drug backup from Google Sheet"
            git push
          else
            echo "Nothing to save."
          fi
