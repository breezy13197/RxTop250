<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rx Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
body{margin:0;-webkit-font-smoothing:antialiased;background:#FFF7EC}
*{box-sizing:border-box}
a{color:#6741D9}a:hover{color:#4C2BB0}
input::placeholder,textarea::placeholder{color:#8A8296}
.skillrow{scrollbar-width:thin}
button{-webkit-tap-highlight-color:transparent}
.flipper{display:grid;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.75,.25,1);cursor:pointer}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden}
@media (max-width:560px){.wrap{padding:18px 14px 48px !important}.h1{font-size:32px !important}
  .front{min-height:300px !important}
  /* Keep the grading buttons on screen while scrolling a long card back */
  .gradebar{position:sticky;bottom:0;z-index:5;background:#FFF7EC;margin:0 -14px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:2px dashed #E3D9CC;gap:8px !important}
  .gradeline{flex-wrap:nowrap !important;gap:8px !important}
  .gradebar .gstatus,.gradebar .gsub{display:none}
  .gradebar .gbtn{min-width:0 !important;padding:10px 12px !important;font-size:15px !important}
  .gradebar .arrow{width:42px !important;height:42px !important}}
</style>
<!-- Backup copy of the drug data (used only if the Google Sheet can't be reached). -->
<script src="data/drugs-backup.js"></script>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   0. SETTINGS
   SHEET_ID is the long code in the Google Sheet's web address:
   docs.google.com/spreadsheets/d/<SHEET_ID>/edit
   ===================================================================== */
const SHEET_ID = '1MGGz9hqHF-PTv-Z35NzGfuIi7Hp5WAvj5cSWiv6emis';
const SHEET_TAB = 'Drugs';
const SHEET_EDIT_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/edit';
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&headers=1&sheet=' + encodeURIComponent(SHEET_TAB);

/* =====================================================================
   1. BODY SYSTEMS (card colors) and INFORMATION TIERS
   ===================================================================== */
const SYS = {
  endo:  { label: 'Endocrine',              color: '#C2255C', soft: '#FDE7EF' },
  cardio:{ label: 'Cardiovascular',         color: '#C2410C', soft: '#FDEBDD' },
  resp:  { label: 'Respiratory',            color: '#0B7285', soft: '#DDF2F5' },
  gi:    { label: 'GI',                     color: '#9A5B00', soft: '#FBEFD6' },
  cns:   { label: 'CNS',                    color: '#6741D9', soft: '#ECE6FD' },
  inf:   { label: 'Anti-infective',         color: '#237032', soft: '#E2F2E5' },
  heme:  { label: 'Hematologic',            color: '#1864AB', soft: '#E0ECF8' },
  msk:   { label: 'Pain & Musculoskeletal', color: '#862E9C', soft: '#F3E5F7' },
  gu:    { label: 'Renal & GU',             color: '#364FC7', soft: '#E5E9FB' },
  other: { label: 'Other',                  color: '#495057', soft: '#ECEEF0' },
};
const SYS_BY_LABEL = Object.fromEntries(Object.entries(SYS).map(([k, s]) => [s.label.toLowerCase(), k]));

const TIERS = {
  1: { name: 'Tier 1', desc: 'Basics', color: '#3B2F55' },
  2: { name: 'Tier 2', desc: 'Pharmacology', color: '#0B7285' },
  3: { name: 'Tier 3', desc: 'Safety & counseling', color: '#B42318' },
};

/* =====================================================================
   2. LOADING DRUG DATA
   The app shows the backup copy instantly, then swaps in the live
   Google Sheet data as soon as it arrives.
   ===================================================================== */
// Spreadsheet header -> field name. Matching ignores case, spaces and "(Tier n)".
const COLS = {
  generic: 'generic', brand: 'brand', drugclass: 'cls', bodysystem: 'sys', route: 'route',
  controlledsubstance: 'ctrl', cpl: 'cpl', fdaindication1: 'ind1', fdaindication2: 'ind2',
  mechanismofaction: 'moa', dosageforms: 'forms', monitoring: 'mon',
  boxedwarning: 'boxed', contraindications: 'contra', adverseeffects: 'ae', patientcounseling: 'coun',
  rems: 'rems', nioshhazardousdrug: 'niosh', niosh: 'niosh',
  facultyreviewed: 'reviewed',
};
const normHead = h => String(h).toLowerCase().replace(/\(.*?\)/g, '').replace(/[^a-z0-9]/g, '');
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

function buildDrugs(head, rows) {
  const idx = {};
  head.forEach((h, i) => { const f = COLS[normHead(h)]; if (f && !(f in idx)) idx[f] = i; });
  if (!('generic' in idx)) throw new Error('No "Generic" column found');
  const seen = new Set();
  const out = [];
  for (const r of rows) {
    const get = f => (f in idx ? String(r[idx[f]] == null ? '' : r[idx[f]]).trim() : '');
    const generic = get('generic');
    if (!generic) continue;
    const brand = get('brand');
    let id = slug(generic);
    if (seen.has(id)) id = slug(generic + ' ' + (brand || out.length));
    seen.add(id);
    const ctrl = get('ctrl') || 'Not Controlled';
    const route = get('route');
    out.push({
      id, generic, brand, cls: get('cls'), route,
      routeGroup: /^oral$/i.test(route) ? 'Oral' : /^injectable$/i.test(route) ? 'Injectable' : 'Other',
      sys: SYS_BY_LABEL[get('sys').toLowerCase()] || 'other',
      ctrl, controlled: !/^not/i.test(ctrl) && ctrl !== '',
      cpl: get('cpl').toUpperCase().replace(/\s+/g, ''),
      ind: [get('ind1'), get('ind2')].filter(Boolean),
      moa: get('moa'), forms: get('forms'), mon: get('mon'),
      boxed: /^(none|n\/a|-)?$/i.test(get('boxed')) ? '' : get('boxed'),
      contra: get('contra'), ae: get('ae'), coun: get('coun'),
      rems: get('rems'), niosh: get('niosh'),
      reviewed: /^y/i.test(get('reviewed')),
    });
  }
  return out;
}

// Reads CSV text (handles quotes, commas and line breaks inside cells).
function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}

let DRUGS = [];
let dataStatus = { source: 'backup', note: '' };
try {
  DRUGS = buildDrugs(window.RX_BACKUP.head, window.RX_BACKUP.rows);
  dataStatus = { source: 'backup', note: 'Loading the latest drug data…' };
} catch (e) {
  dataStatus = { source: 'none', note: 'Loading drug data…' };
}

async function loadLiveData() {
  try {
    const res = await fetch(SHEET_CSV_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const rows = parseCSV(await res.text());
    const live = buildDrugs(rows[0], rows.slice(1));
    if (!live.length) throw new Error('Sheet has no drugs');
    DRUGS = live;
    dataStatus = { source: 'live', note: '' };
  } catch (e) {
    const snap = window.RX_BACKUP && window.RX_BACKUP.snapshot;
    dataStatus = { source: DRUGS.length ? 'backup' : 'none',
      note: DRUGS.length ? 'Showing the saved copy of the drug data from ' + snap + ' (the live Google Sheet could not be reached).'
                         : 'Could not load the drug data. Check your internet connection and refresh.' };
  }
  render();
}

/* =====================================================================
   3. LOOK — the "Sticker" style
   ===================================================================== */
const T = {
  page:'#FFF7EC', pageInk:'#2A2238', pageMuted:'#6B6178', ink:'#2A2238',
  head:"'Fredoka', sans-serif", body:"'Nunito', sans-serif", label:"'Fredoka', sans-serif",
  cardRadius:'26px', cardBorder:'3px solid #2A2238', cardShadow:'7px 7px 0 #2A2238',
  panelBg:'#FFFFFF', panelBorder:'2.5px solid #2A2238', panelRadius:'20px', divider:'2px dashed #E3D9CC',
  btnRadius:'14px', btnBorder:'2.5px solid #2A2238', btnBg:'#FFFFFF', btnFg:'#2A2238', btnShadow:'3px 3px 0 #2A2238',
  primaryBg:'#2A2238', primaryFg:'#FFF7EC',
  fieldPad:'12px 14px', fieldRadius:'14px', fieldRadiusLg:'18px',
};
const hash = s => { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
// Shrinks large text so its longest word fits on one line (never breaks a word in half).
const fitSize = (text, maxPx, sidePx) => {
  const longest = Math.max(1, ...String(text).split(/\s+/).map(w => w.length));
  return `min(${maxPx}px, calc((100vw - ${sidePx}px) / ${(longest * 0.64).toFixed(2)}))`;
};
const newSeed = () => Math.random().toString(36).slice(2);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

/* =====================================================================
   4. APP STATE
   Remembered in this browser: per-skill progress, custom lists, chosen tiers, card front.
   ===================================================================== */
const store = {
  get(k, fallback) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? fallback : v; } catch (e) { return fallback; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
/* "Skills" are the separate things a student can know about a drug. Each card
   is graded per skill, so the app can tell "knows the names but not the mechanism". */
const SKILLS = {
  names:  { tier: 1, label: 'Names',               short: 'Names' },
  uses:   { tier: 1, label: 'Class & uses',        short: 'Uses' },
  moa:    { tier: 2, label: 'Mechanism',           short: 'MOA' },
  mon:    { tier: 2, label: 'Dosing & monitoring', short: 'Mon.' },
  safety: { tier: 3, label: 'Safety warnings',     short: 'Safety' },
  ae:     { tier: 3, label: 'Adverse effects',     short: 'AEs' },
  coun:   { tier: 3, label: 'Counseling',          short: 'Couns.' },
};
const STATUS = {
  solid:    { color: '#237032', glyph: '✓', text: 'Solid' },
  learning: { color: '#9A6700', glyph: '~', text: 'Learning' },
  weak:     { color: '#B42318', glyph: '✗', text: 'Weak' },
  new:      { color: '#8A8296', glyph: '·', text: 'Not tried' },
};
const savedTiers = store.get('rxcards-tiers', [1, 2, 3]);
const loadLists = () => {
  const v = store.get('rxcards-lists', []);
  return Array.isArray(v) ? v.filter(l => l && l.id && Array.isArray(l.ids)).map(l => ({ id: String(l.id), name: String(l.name || 'My list'), ids: l.ids.map(String) })) : [];
};
// progress = { drugId: { skill: "0110" } }  (last 4 results for each skill, 1 = knew it, 0 = missed)
let progress = store.get('rxcards-skills', null);
if (!progress || typeof progress !== 'object' || Array.isArray(progress)) {
  progress = {};
  // Older versions saved a plain "missed cards" list. Treat those cards as weak in every skill.
  const old = store.get('rxcards-missed', []);
  if (Array.isArray(old)) old.forEach(id => { progress[id] = Object.fromEntries(Object.keys(SKILLS).map(k => [k, '0'])); });
  store.set('rxcards-skills', progress);
}
const state = {
  mode: 'flash',
  tiers: Array.isArray(savedTiers) && savedTiers.length ? savedTiers.filter(t => TIERS[t]) : [1, 2, 3],
  front: store.get('rxcards-front', 'Generic'),
  route: 'All', cpl: [], sys: [], ctrlOnly: false, boxedOnly: false, remsOnly: false, nioshOnly: false,
  weak: null,        // null, 'any', or a skill name: study only drugs that were weak in it...
  weakSnap: null,    // ...as of the moment it was chosen (so cards don't vanish mid-session)
  idx: 0, flipped: false, skillMiss: [], search: '',
  lists: loadLists(), activeList: store.get('rxcards-activelist', null), listEdit: null,
  lsearch: '', lonly: false, paste: '', pasteMsg: '',
  qn: 0, picked: null, score: 0, total: 0,
  seed: newSeed(),   // card order is shuffled with this; the Shuffle button makes a new one
  backTier: null,    // which tier tab is open on the back of the card
  panelOpen: window.innerWidth >= 700,   // settings panel starts folded on phones
};
if (!state.lists.some(l => l.id === state.activeList)) state.activeList = null;
state.listEdit = state.activeList || (state.lists[0] && state.lists[0].id) || null;
if (!Array.isArray(state.tiers) || !state.tiers.length) state.tiers = [1, 2, 3];

function setState(patch) {
  Object.assign(state, patch);
  if ('tiers' in patch) store.set('rxcards-tiers', state.tiers);
  if ('front' in patch) store.set('rxcards-front', state.front);
  if ('activeList' in patch) store.set('rxcards-activelist', state.activeList);
  render();
}
const hasTier = n => state.tiers.includes(n);
const activeSkills = () => Object.keys(SKILLS).filter(k => hasTier(SKILLS[k].tier));
const skillStatus = (id, skill) => {
  const h = (progress[id] || {})[skill] || '';
  return !h ? 'new' : h.endsWith('0') ? 'weak' : h.endsWith('11') ? 'solid' : 'learning';
};
const weakSkillsOf = id => activeSkills().filter(k => skillStatus(id, k) === 'weak');
function recordSkill(id, skill, ok) {
  const p = progress[id] || (progress[id] = {});
  p[skill] = ((p[skill] || '') + (ok ? '1' : '0')).slice(-4);
  store.set('rxcards-skills', progress);
}
// Grades every skill that is switched on; "missedSkills" is a list of skills, or 'all'.
function gradeCard(id, missedSkills) {
  activeSkills().forEach(k => recordSkill(id, k, missedSkills !== 'all' && !missedSkills.includes(k)));
}
// Which drugs are weak (right now) in a skill, or in any skill. Used to build a weak-spot study set.
function weakSnapshot(v) {
  if (!v) return null;
  const m = {};
  DRUGS.forEach(d => { const w = weakSkillsOf(d.id).filter(k => v === 'any' || k === v); if (w.length) m[d.id] = w; });
  return m;
}
const setWeak = v => resetPos({ weak: state.weak === v ? null : v, weakSnap: state.weak === v ? null : weakSnapshot(v) });
const activeListObj = () => state.lists.find(l => l.id === state.activeList) || null;

function deck(ignoreWeak) {
  const s = state, list = activeListObj(), inList = list ? new Set(list.ids) : null;
  return DRUGS.filter(d =>
    (!inList || inList.has(d.id)) &&
    (s.route === 'All' || d.routeGroup === s.route) &&
    (!s.cpl.length || s.cpl.includes(d.cpl)) &&
    (!s.sys.length || s.sys.includes(d.sys)) &&
    (!s.ctrlOnly || d.controlled) &&
    (!s.boxedOnly || !!d.boxed) &&
    (!s.remsOnly || !!d.rems) &&
    (!s.nioshOnly || !!d.niosh) &&
    (ignoreWeak || !s.weakSnap || !!s.weakSnap[d.id]))
    .sort((a, b) => hash(a.id + s.seed) - hash(b.id + s.seed));
}
function resetPos(extra = {}) { setState({ idx: 0, flipped: false, skillMiss: [], qn: 0, picked: null, ...extra }); }
function step(n) { const len = deck().length || 1; setState({ idx: (state.idx + n + len) % len, flipped: false, skillMiss: [] }); }
function toggleTier(n) {
  const on = hasTier(n);
  if (on && state.tiers.length === 1) return; // keep at least one tier on
  const tiers = on ? state.tiers.filter(t => t !== n) : [...state.tiers, n].sort();
  const weakGone = state.weak && state.weak !== 'any' && !tiers.includes(SKILLS[state.weak].tier);
  setState({ tiers, flipped: state.flipped, picked: null, skillMiss: [],
    ...(weakGone ? { weak: null, weakSnap: null } : {}) });
}
/* Flipping only swaps the card's rotation, so the 3D animation plays smoothly. */
function flip() {
  state.flipped = !state.flipped;
  const el = document.getElementById('flipper');
  if (el) el.style.transform = state.flipped ? 'rotateY(180deg)' : 'rotateY(0deg)';
}

/* =====================================================================
   5. CARD CONTENT
   ===================================================================== */
function frontFor(d, idx) {
  let f = state.front;
  if (f === 'Random') f = ['Generic', 'Brand', 'Clues'][hash(d.id + idx) % 3];
  if (f === 'Brand' && d.brand) return { label: 'Brand name — what is the generic?', text: d.brand, sub: '' };
  if (f === 'Clues') return { label: 'Name the drug', text: d.cls || 'Drug', sub: [...d.ind, d.route].filter(Boolean).join(' · ') };
  return { label: 'Generic — recall the details', text: d.generic, sub: '' };
}

// The back of the card, grouped by information tier.
function backSections(d) {
  const sections = [];
  if (hasTier(1)) sections.push({ tier: 1, fields: [
    { label: 'Therapeutic class', text: d.cls },
    { label: 'FDA indication(s)', text: d.ind.join('; ') },
    { label: 'Controlled substance', text: d.ctrl },
  ].filter(f => f.text) });
  if (hasTier(2)) sections.push({ tier: 2, fields: [
    { label: 'Mechanism of action', text: d.moa },
    { label: 'Dosage forms', text: d.forms },
    { label: 'Monitoring', text: d.mon },
  ].filter(f => f.text) });
  if (hasTier(3)) sections.push({ tier: 3, boxed: d.boxed, fields: [
    { label: 'REMS program', text: d.rems },
    { label: 'NIOSH hazardous drug', text: d.niosh },
    { label: 'Contraindications', text: d.contra },
    { label: 'Adverse effects', text: d.ae },
    { label: 'Patient counseling', text: d.coun },
  ].filter(f => f.text) });
  return sections;
}

/* =====================================================================
   6. QUIZ — only asks about the tiers that are switched on
   ===================================================================== */
// Words that are part of salt/formulation names, ignored when checking if a text "gives away" a drug name.
const NAME_STOP = new Set('sodium hydrochloride calcium potassium sulfate magnesium chloride acetate tartrate succinate maleate besylate phosphate citrate mesylate bromide fumarate bitartrate acetonide propionate dihydrate trihydrate monohydrate crystalline hyclate oxalate hydrobromide dimesylate xinafoate furoate recombinant origin extended release topical inhalation nasal transdermal tablets'.split(' '));
const nameWords = d => (String(d.generic + ' ' + d.brand).toLowerCase().match(/[a-z]{5,}/g) || []).filter(w => !NAME_STOP.has(w));
const mentions = (text, d) => { const t = String(text).toLowerCase(); return nameWords(d).some(w => t.includes(w)); };
const wordSet = t => new Set(String(t).toLowerCase().match(/[a-z0-9]{4,}/g) || []);
// Share of words two texts have in common (0 = nothing alike, 1 = same words).
const similarity = (a, b) => { const A = wordSet(a), B = wordSet(b); let n = 0; for (const w of A) if (B.has(w)) n++; return n / Math.max(1, Math.min(A.size, B.size)); };
const onlyHypersensitivity = t => /^(none\.?|hypersensitivity[^;]*\.?)$/i.test(String(t).trim());

/* Each Tier 2/3 field is asked both ways:
   "forward"  = show the information, pick the drug;
   "reverse"  = show the drug, pick the information. */
const QUIZ_FIELDS = [
  { f: 'moa',    tier: 2, skill: 'moa',    fwd: 'Which drug works this way?',              inv: 'How does this drug work?' },
  { f: 'mon',    tier: 2, skill: 'mon',    fwd: 'Which drug needs this monitoring?',       inv: 'What should be monitored?' },
  { f: 'forms',  tier: 2, skill: 'mon',    fwd: null,                                      inv: 'Which dosage forms are available?' },
  { f: 'boxed',  tier: 3, skill: 'safety', fwd: 'Which drug carries this boxed warning?',  inv: 'What is its boxed warning?' },
  { f: 'contra', tier: 3, skill: 'safety', fwd: null,                                      inv: 'What are its contraindications?' },
  { f: 'ae',     tier: 3, skill: 'ae',     fwd: 'Which drug has these common adverse effects?', inv: 'What are its common adverse effects?' },
  { f: 'coun',   tier: 3, skill: 'coun',   fwd: 'Which drug goes with this counseling?',   inv: 'Which counseling points go with it?' },
];
const usable = (x, f) => x[f] && !(f === 'contra' && onlyHypersensitivity(x[f]));
const QUIZ_TYPES = [
  { tier: 1, skill: 'uses', q: 'Which drug class?', stem: d => d.generic, ans: d => d.cls, need: d => d.cls,
    ok: (x, d) => x.sys !== d.sys },
  { tier: 1, skill: 'names', q: 'What is the generic name?', stem: d => d.brand, ans: d => d.generic, need: d => d.brand,
    ok: (x, d) => x.generic !== d.generic },
  { tier: 1, skill: 'uses', q: 'Primary FDA indication?', stem: d => d.generic, ans: d => d.ind[0], need: d => d.ind[0],
    ok: (x, d) => x.sys !== d.sys && !d.ind.includes(x.ind[0]) },
  ...QUIZ_FIELDS.filter(F => F.fwd).map(F => ({
    tier: F.tier, skill: F.skill, q: F.fwd, stem: d => d[F.f], ans: d => d.generic,
    need: d => usable(d, F.f) && !mentions(d[F.f], d),
    ok: (x, d) => x.generic !== d.generic && x.cls !== d.cls && (!x[F.f] || similarity(x[F.f], d[F.f]) < 0.5),
  })),
  ...QUIZ_FIELDS.map(F => ({
    tier: F.tier, skill: F.skill, q: F.inv, reverse: true, stem: d => d.generic, sub: d => d.brand, ans: d => d[F.f],
    need: d => usable(d, F.f) && !mentions(d[F.f], d),
    ok: (x, d) => usable(x, F.f) && x.cls !== d.cls && !mentions(x[F.f], x) && !mentions(x[F.f], d) &&
                  similarity(x[F.f], d[F.f]) < 0.35,
  })),
];
function quiz(dk) {
  const s = state;
  // Find the next drug (from position qn) that has a question in the chosen tiers.
  let d = null, types = [];
  for (let k = 0; k < dk.length; k++) {
    const cand = dk[(s.qn + k) % dk.length];
    let t = QUIZ_TYPES.filter(x => hasTier(x.tier) && x.need(cand));
    // When studying weak spots, ask about the skill the student was weak in.
    const ws = s.weakSnap && s.weakSnap[cand.id], pref = ws ? t.filter(x => ws.includes(x.skill)) : [];
    if (pref.length) t = pref;
    if (t.length) { d = cand; types = t; break; }
  }
  if (!d) return null;
  const ty = types[hash(d.id + s.qn + s.seed) % types.length];
  const correct = ty.ans(d);
  // Wrong answers: never true for this drug (different class, different wording),
  // and drawn from the same body system first so they look plausible.
  const seen = new Set([correct]), pool = [];
  DRUGS.filter(x => x.id !== d.id && ty.ans(x) && ty.ok(x, d))
    .map(x => ({ x, rank: (x.sys === d.sys ? 0 : 1) * 1e10 + hash(x.id + d.id + s.seed + s.qn) }))
    .sort((a, b) => a.rank - b.rank)
    .forEach(({ x }) => { const v = ty.ans(x); if (pool.length < 3 && !seen.has(v)) { seen.add(v); pool.push(v); } });
  const opts = [correct, ...pool].sort((a, b) => hash(b + s.seed + s.qn) - hash(a + s.seed + s.qn));
  const answered = s.picked != null;
  const sy = SYS[d.sys];
  const options = opts.map((o, i) => {
    const isRight = o === correct, isPicked = s.picked === o;
    let bg = T.btnBg, fg = T.btnFg, keyBg = sy.soft, keyFg = sy.color;
    if (answered && isRight) { bg = '#237032'; fg = '#FFFFFF'; keyBg = '#FFFFFF'; keyFg = '#237032'; }
    else if (answered && isPicked) { bg = '#B42318'; fg = '#FFFFFF'; keyBg = '#FFFFFF'; keyFg = '#B42318'; }
    return { label: o, key: 'ABCD'[i], bg, fg, keyBg, keyFg,
      onClick: () => { if (answered) return; recordSkill(d.id, ty.skill, isRight); setState({ picked: o, total: s.total + 1, score: s.score + (isRight ? 1 : 0) }); } };
  });
  const stem = ty.stem(d);
  return {
    d, sy, tier: ty.tier, skill: ty.skill, question: ty.q, stem, sub: ty.sub ? ty.sub(d) : '', stemSize: stem.length > 140 ? '20px' : stem.length > 60 ? '24px' : '38px',
    options, answered, score: s.score, total: s.total,
    feedback: !answered ? '' : s.picked === correct ? 'Correct.' : ty.reverse ? 'Not quite. The correct answer is shown in green.' : 'Answer: ' + correct,
    reveal: answered ? d.generic + (d.brand ? ' (' + d.brand + ')' : '') : '',
    next: () => setState({ qn: (dk.indexOf(d) + 1), picked: null }),
  };
}

/* =====================================================================
   7. DRAWING THE SCREEN
   Each button gets a numbered click handler (data-h="n").
   ===================================================================== */
let handlers = [];
const on = fn => { handlers.push(fn); return 'data-h="' + (handlers.length - 1) + '"'; };

function chip(active, onClick, label, extra = {}) {
  return { label, onClick, bg: active ? T.pageInk : 'transparent', fg: active ? T.page : T.pageInk, border: '2px solid #2A2238', ...extra };
}
function chipHtml(c, size = '6px 12px') {
  const dot = c.dot ? `<span style="width:11px;height:11px;border-radius:50%;background:${c.dot};border:1.5px solid #2A2238"></span>` : '';
  const layout = c.dot ? 'display:flex;align-items:center;gap:7px;padding:6px 12px 6px 9px;' : `padding:${size};`;
  return `<button ${c.id ? 'id="' + c.id + '" ' : ''}${on(c.onClick)} aria-pressed="${c.bg !== 'transparent'}" style="${layout}font-family:${T.label};font-size:13px;font-weight:600;border-radius:999px;border:${c.border};background:${c.bg};color:${c.fg};cursor:pointer">${dot}${esc(c.label)}</button>`;
}
const lbl = (text, minW) => `<span style="font-family:${T.label};font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:${T.pageMuted}${minW ? ';min-width:44px' : ''}">${text}</span>`;
const tierBadge = (n, dark) => `<span style="flex:none;font-family:${T.label};font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:${dark ? '#FFFFFF' : TIERS[n].color};color:${dark ? TIERS[n].color : '#FFFFFF'}">${TIERS[n].name}</span>`;

              ${[['←', -1, 'Previous card'], ['→', 1, 'Next card']].map(([ch, n, aria]) => `<button ${on(() => step(n))} aria-label="${aria}" class="arrow" style="font-family:${T.head};font-size:16px;font-weight:600;width:46px;height:46px;border-radius:${T.btnRadius};border:${T.btnBorder};background:${T.btnBg};color:${T.btnFg};box-shadow:${T.btnShadow};cursor:pointer">${ch}</button>`).join('')}
            </div>
            <span class="gstatus" style="font-family:${T.label};font-size:14px;font-weight:600;color:${T.pageMuted}">${esc(statusLabel)}</span>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            ${gradeBtns.map(g => `<button class="gbtn" ${on(g.onClick)} style="display:flex;flex-direction:column;align-items:center;gap:1px;min-width:92px;font-family:${T.head};font-size:16px;font-weight:600;padding:10px 16px;border-radius:${T.btnRadius};border:${T.btnBorder};background:${g.bg};color:${g.fg};box-shadow:${T.btnShadow};cursor:pointer">${esc(g.label)}<span class="gsub" style="font-family:${T.label};font-size:11px;font-weight:600;opacity:.85">${esc(g.sub)}</span></button>`).join('')}
          </div>
        </div>
      </div>`;
    }
    html += `</div>`;
  }

  // ---------- Quiz ----------
  if (s.mode === 'quiz' && dk.length) {
    const q = quiz(dk);
    if (!q) {
      html += `<div style="padding:60px 20px;text-align:center;font-family:${T.head};font-size:22px;color:${T.pageMuted}">No quiz questions for these cards in the tiers you picked. Try turning on another tier.</div>`;
    } else {
      const sy = q.sy;
      html += `
    <div style="max-width:780px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;flex-direction:column;border-radius:${T.cardRadius};border:${T.cardBorder};box-shadow:${T.cardShadow};background:${sy.soft};color:${T.ink};overflow:hidden">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:20px 24px 0;flex-wrap:wrap">
          <span style="display:flex;gap:8px;align-items:center"><span style="font-family:${T.label};font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:999px;background:${sy.color};color:#FFFFFF;border:2px solid #2A2238">${esc(sy.label)}</span>${tierBadge(q.tier)}<span style="font-family:${T.label};font-size:12px;font-weight:700;color:${T.pageMuted}">${esc(SKILLS[q.skill].label)}</span></span>
          <span style="font-family:${T.label};font-size:14px;font-weight:700">Score ${q.score} / ${q.total}</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px;padding:26px 28px 30px">
          <div style="font-family:${T.label};font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:${sy.color}">${esc(q.question)}</div>
          <div style="font-family:${T.head};font-size:${q.stem.length > 60 ? q.stemSize : fitSize(q.stem, parseInt(q.stemSize), 110)};font-weight:700;line-height:1.25;text-wrap:pretty">${esc(q.stem)}</div>
          ${q.sub ? `<div style="font-size:18px;font-weight:600;color:${T.pageMuted}">${esc(q.sub)}</div>` : ''}
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:10px">
        ${q.options.map(o => `<button ${on(o.onClick)} style="display:flex;align-items:center;gap:12px;text-align:left;font-family:${T.body};font-size:${o.label.length > 70 ? 15 : 17}px;font-weight:600;line-height:1.35;padding:16px 18px;border-radius:${T.btnRadius};border:${T.btnBorder};background:${o.bg};color:${o.fg};box-shadow:${T.btnShadow};cursor:pointer"><span style="flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;font-family:${T.label};font-size:14px;font-weight:800;background:${o.keyBg};color:${o.keyFg}">${o.key}</span><span>${esc(o.label)}</span></button>`).join('')}
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;min-height:48px">
        <span style="display:flex;flex-direction:column;gap:2px"><span style="font-family:${T.head};font-size:18px;font-weight:600">${esc(q.feedback)}</span>${q.answered ? `<span style="font-size:14px;color:${T.pageMuted}">Card: ${esc(q.reveal)}</span>` : ''}</span>
        ${q.answered ? `<button ${on(q.next)} style="font-family:${T.head};font-size:16px;font-weight:600;padding:12px 22px;border-radius:${T.btnRadius};border:${T.btnBorder};background:${T.primaryBg};color:${T.primaryFg};box-shadow:${T.btnShadow};cursor:pointer">Next question →</button>` : ''}
      </div>
    </div>`;
    }
  }

  // ---------- My progress ----------
  if (s.mode === 'progress' && dk.length) html += progressHtml(dk);

  // ---------- My lists ----------
  if (s.mode === 'lists') html += listsHtml();

  // ---------- Browse ----------
  if (s.mode === 'browse' && dk.length) {
    html += `
    <div style="display:flex;flex-direction:column;gap:14px">
      <input id="search" value="${esc(s.search)}" placeholder="Search generic, brand, class, or indication" aria-label="Search drugs" style="width:100%;font-family:${T.body};font-size:17px;padding:14px 18px;border-radius:${T.btnRadius};border:${T.btnBorder};background:${T.btnBg};color:${T.btnFg};box-shadow:${T.btnShadow};outline:none">
      <div id="browse-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px">${browseHtml(dk)}</div>
    </div>`;
  }

  // ---------- Footer ----------
  html += `
    <footer style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;font-family:${T.label};font-size:13px;color:${T.pageMuted}">
      <span>${DRUGS.length} drugs · ${dataStatus.source === 'live' ? 'live from the faculty Google Sheet' : 'saved copy'}</span>
      <a href="${SHEET_EDIT_URL}" target="_blank" rel="noopener">View drug data</a>
    </footer>`;

  html += `</div></div>`;

  const focusedId = document.activeElement && ['search', 'lsearch', 'lname'].includes(document.activeElement.id) ? document.activeElement.id : null;
  document.getElementById('app').innerHTML = html;
  if (focusedId) { const el = document.getElementById(focusedId); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
}

/* =====================================================================
   7b. MY PROGRESS — how well each skill is known, for the cards currently selected
   ===================================================================== */
function progressHtml(dk) {
  const act = activeSkills();
  const tally = k => { const c = { solid: 0, learning: 0, weak: 0, new: 0 }; dk.forEach(d => c[skillStatus(d.id, k)]++); return c; };
  const anyWeak = dk.filter(d => weakSkillsOf(d.id).length).length;
  const tried = dk.filter(d => act.some(k => skillStatus(d.id, k) !== 'new'))
    .sort((a, b) => weakSkillsOf(b.id).length - weakSkillsOf(a.id).length || a.generic.localeCompare(b.generic));
  const btn = (label, onClick, primary, disabled) => `<button ${disabled ? 'disabled' : on(onClick)} style="font-family:${T.head};font-size:15px;font-weight:600;padding:9px 16px;border-radius:${T.btnRadius};border:${T.btnBorder};background:${primary ? T.primaryBg : T.btnBg};color:${primary ? T.primaryFg : T.btnFg};box-shadow:${disabled ? 'none' : T.btnShadow};cursor:${disabled ? 'default' : 'pointer'};opacity:${disabled ? .45 : 1}">${label}</button>`;
  const rows = act.map(k => {
    const c = tally(k), n = dk.length || 1;
    const seg = st => c[st] ? `<span style="flex:${c[st]};background:${STATUS[st].color}" title="${STATUS[st].text}: ${c[st]}"></span>` : '';
    return `
    <div style="display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:${T.fieldRadius};background:#FFFFFF;border:2px solid #2A2238">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <span style="display:flex;gap:8px;align-items:center">${tierBadge(SKILLS[k].tier)}<span style="font-family:${T.head};font-size:17px;font-weight:700">${esc(SKILLS[k].label)}</span></span>
        ${btn('Practise weak (' + c.weak + ')', () => resetPos({ mode: 'flash', weak: k, weakSnap: weakSnapshot(k) }), false, !c.weak)}
      </div>
      <div style="display:flex;height:14px;border-radius:999px;overflow:hidden;border:2px solid #2A2238;background:#ECE6DB">${seg('solid')}${seg('learning')}${seg('weak')}${c.new ? `<span style="flex:${c.new};background:#ECE6DB" title="Not tried: ${c.new}"></span>` : ''}</div>
      <div style="font-family:${T.label};font-size:13px;color:${T.pageMuted}">${['solid', 'learning', 'weak', 'new'].map(st => `<span style="color:${STATUS[st].color};font-weight:700">${STATUS[st].glyph}</span> ${c[st]} ${STATUS[st].text.toLowerCase()}`).join(' &nbsp;·&nbsp; ')}</div>
    </div>`;
  }).join('');
  const cols = `minmax(120px,1fr) repeat(${act.length}, 46px)`;
  return `
  <div style="max-width:780px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="font-family:${T.head};font-size:22px;font-weight:700">My progress</div>
      <div style="font-size:15px;line-height:1.5;color:${T.pageMuted}">Each skill is tracked separately for every drug, using your last few answers in Flip &amp; grade and the Quiz. <b>Solid</b> = right twice in a row, <b>Learning</b> = right last time, <b>Weak</b> = wrong last time. This covers the ${dk.length} cards currently selected (change the list or filters above to look at a different set).</div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      ${btn('Study my weak spots (' + anyWeak + (anyWeak === 1 ? ' drug' : ' drugs') + ')', () => resetPos({ mode: 'flash', weak: 'any', weakSnap: weakSnapshot('any') }), true, !anyWeak)}
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">${rows}</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="font-family:${T.head};font-size:18px;font-weight:700">Drug by drug</div>
      ${tried.length ? `
      <div style="overflow-x:auto;border-radius:${T.fieldRadius};border:2px solid #2A2238;background:#FFFFFF">
        <div style="display:grid;grid-template-columns:${cols};min-width:max-content;width:100%;align-items:center;font-size:14px">
          <div style="padding:8px 12px;font-family:${T.label};font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:${T.pageMuted};border-bottom:2px solid #2A2238">Drug</div>
          ${act.map(k => `<div title="${esc(SKILLS[k].label)}" style="padding:8px 2px;text-align:center;font-family:${T.label};font-size:11px;font-weight:700;color:${T.pageMuted};border-bottom:2px solid #2A2238">${esc(SKILLS[k].short)}</div>`).join('')}
          ${tried.map(d => `
          <div style="padding:8px 12px;font-weight:700;border-bottom:1px dashed #E3D9CC">${esc(d.generic)}</div>
          ${act.map(k => { const st = STATUS[skillStatus(d.id, k)]; return `<div title="${esc(SKILLS[k].label)}: ${st.text}" style="padding:8px 2px;text-align:center;font-weight:800;color:${st.color};border-bottom:1px dashed #E3D9CC">${st.glyph}</div>`; }).join('')}`).join('')}
        </div>
      </div>
      <div style="font-family:${T.label};font-size:12px;color:${T.pageMuted}">${['solid', 'learning', 'weak', 'new'].map(st => `<span style="color:${STATUS[st].color};font-weight:800">${STATUS[st].glyph}</span> ${STATUS[st].text}`).join(' &nbsp; ')}</div>` :
      `<div style="padding:24px;text-align:center;color:${T.pageMuted};border-radius:${T.fieldRadius};border:2px dashed #E3D9CC">Nothing here yet. Grade some cards or answer some quiz questions and your results will show up.</div>`}
    </div>
    <div style="border-top:${T.divider};padding-top:12px">
      <button ${on(() => { if (confirm('Erase all of your saved progress on this device? Your custom lists are not affected.')) { progress = {}; store.set('rxcards-skills', progress); resetPos({ weak: null, weakSnap: null }); } })} style="font-family:${T.label};font-size:13px;background:none;border:none;color:${T.pageMuted};text-decoration:underline;cursor:pointer;padding:0">Reset my progress</button>
    </div>
  </div>`;
}

/* =====================================================================
   7c. MY LISTS — students build their own decks (e.g. everything on Exam 2)
   ===================================================================== */
const saveLists = () => { store.set('rxcards-lists', state.lists); store.set('rxcards-activelist', state.activeList); };
const curList = () => state.lists.find(l => l.id === state.listEdit) || null;
const listLabel = l => l.name + ' (' + l.ids.length + ')';
function newList() {
  const l = { id: 'l' + Date.now().toString(36), name: 'My list ' + (state.lists.length + 1), ids: [] };
  state.lists.push(l);
  Object.assign(state, { listEdit: l.id, lsearch: '', lonly: false, paste: '', pasteMsg: '' });
  saveLists(); render();
}
function deleteList() {
  const l = curList(); if (!l) return;
  if (!confirm('Delete the list "' + l.name + '"? The drugs themselves are not affected.')) return;
  state.lists = state.lists.filter(x => x.id !== l.id);
  if (state.activeList === l.id) state.activeList = null;
  state.listEdit = state.lists[0] ? state.lists[0].id : null;
  saveLists(); resetPos();
}
function listShown() {
  const l = curList(); if (!l) return [];
  const q = state.lsearch.trim().toLowerCase(), has = new Set(l.ids);
  return DRUGS.filter(d => (!state.lonly || has.has(d.id)) && (!q || [d.generic, d.brand, d.cls].join(' ').toLowerCase().includes(q)))
    .sort((a, b) => a.generic.localeCompare(b.generic));
}
function toggleInList(id) {
  const l = curList(); if (!l) return;
  l.ids = l.ids.includes(id) ? l.ids.filter(x => x !== id) : [...l.ids, id];
  saveLists(); refreshBuilder();
}
function bulkList(add) {
  const l = curList(); if (!l) return;
  const shown = listShown().map(d => d.id), set = new Set(l.ids);
  shown.forEach(id => add ? set.add(id) : set.delete(id));
  l.ids = [...set]; saveLists(); refreshBuilder();
}
// Turns pasted names ("lisinopril, Lipitor, metoprolol") into drugs from the deck.
function addPasted() {
  const l = curList(); if (!l) return;
  const norm = t => String(t).toLowerCase().replace(/\(.*?\)/g, ' ').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
  const brands = d => String(d.brand).split(/[,;\/]/).map(norm).filter(Boolean);
  const set = new Set(l.ids); let added = 0, already = 0; const notFound = [];
  state.paste.split(/[\n,;]+/).map(t => t.trim()).filter(Boolean).forEach(tok => {
    const n = norm(tok);
    let hits = n.length < 3 ? [] : DRUGS.filter(d => norm(d.generic) === n || brands(d).includes(n));
    if (!hits.length && n.length >= 3) hits = DRUGS.filter(d => (norm(d.generic) + ' ').startsWith(n + ' ') || brands(d).some(b => b.startsWith(n + ' ')));
    if (!hits.length && n.length >= 4) hits = DRUGS.filter(d => (' ' + norm(d.generic) + ' ').includes(' ' + n + ' '));
    if (!hits.length) { notFound.push(tok); return; }
    hits.forEach(d => { if (set.has(d.id)) already++; else { set.add(d.id); added++; } });
  });
  l.ids = [...set]; saveLists();
  state.pasteMsg = 'Added ' + added + (added === 1 ? ' drug' : ' drugs') + (already ? ' (' + already + ' already in the list)' : '') +
    (notFound.length ? '. Could not find: ' + notFound.join(', ') + '. Try the generic name, or tick them below.' : '.');
  state.paste = notFound.join('\n');
  render();
}
function listGridHtml() {
  const l = curList(); if (!l) return '';
  const has = new Set(l.ids), rows = listShown();
  if (!rows.length) return `<div style="grid-column:1/-1;padding:24px;text-align:center;color:${T.pageMuted}">No drugs match.</div>`;
  return rows.map(d => {
    const sy = SYS[d.sys], sel = has.has(d.id);
    return `<button ${on(() => toggleInList(d.id))} aria-pressed="${sel}" style="display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:${T.fieldRadius};border:2px solid #2A2238;background:${sel ? sy.color : '#FFFFFF'};color:${sel ? '#FFFFFF' : T.ink};cursor:pointer;font-family:${T.body}">
      <span aria-hidden="true" style="flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:6px;border:2px solid ${sel ? '#FFFFFF' : '#2A2238'};font-weight:800;font-size:14px">${sel ? '✓' : ''}</span>
      <span style="display:flex;flex-direction:column;min-width:0"><span style="font-family:${T.head};font-size:16px;font-weight:600;line-height:1.15">${esc(d.generic)}</span>${d.brand ? `<span style="font-size:12px;opacity:.85">${esc(d.brand)}</span>` : ''}</span>
    </button>`;
  }).join('');
}
function refreshBuilder() {
  const l = curList();
  const g = document.getElementById('lgrid'); if (g) g.innerHTML = listGridHtml();
  const c = document.getElementById('lcount'); if (c && l) c.textContent = l.ids.length + (l.ids.length === 1 ? ' drug' : ' drugs') + ' in this list';
  const ch = l && document.getElementById('lchip-' + l.id); if (ch) ch.textContent = listLabel(l);
}
function listsHtml() {
  const s = state, l = curList();
  const small = (label, onClick, primary, extra = '') => `<button ${on(onClick)} style="font-family:${T.head};font-size:15px;font-weight:600;padding:9px 16px;border-radius:${T.btnRadius};border:${T.btnBorder};background:${primary ? T.primaryBg : T.btnBg};color:${primary ? T.primaryFg : T.btnFg};box-shadow:${T.btnShadow};cursor:pointer;${extra}">${label}</button>`;
  let body;
  if (!l) {
    body = `<div style="padding:28px 22px;border-radius:${T.cardRadius};border:2px dashed #2A2238;background:#FFFFFF;display:flex;flex-direction:column;gap:12px;align-items:flex-start">
      <div style="font-family:${T.head};font-size:20px;font-weight:700">Build your own deck</div>
      <div style="font-size:15px;line-height:1.5;color:${T.pageMuted}">Have a quiz on a certain set of drugs? Make a list with just those drugs, then use Flip &amp; grade, the Quiz and My progress on only that list.</div>
      ${small('+ Make my first list', newList, true)}
    </div>`;
  } else {
    const n = l.ids.length;
    body = `
    <div style="display:flex;flex-direction:column;gap:12px;padding:16px 18px;border-radius:${T.panelRadius};background:${T.panelBg};border:${T.panelBorder}">
      <label style="display:flex;flex-direction:column;gap:4px"><span style="font-family:${T.label};font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:${T.pageMuted}">List name</span>
        <input id="lname" value="${esc(l.name)}" maxlength="60" style="font-family:${T.head};font-size:18px;font-weight:600;padding:10px 14px;border-radius:${T.btnRadius};border:${T.btnBorder};background:${T.btnBg};color:${T.btnFg};outline:none"></label>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <span id="lcount" style="font-family:${T.label};font-size:14px;font-weight:700">${n + (n === 1 ? ' drug' : ' drugs')} in this list</span>
        <span style="flex:1"></span>
        ${small('Study this list', () => { if (!l.ids.length) { state.pasteMsg = 'Add at least one drug first.'; render(); } else resetPos({ activeList: l.id, mode: 'flash' }); }, true)}
        ${small('Delete list', deleteList, false, 'color:#B42318')}
      </div>
      ${s.pasteMsg ? `<div role="status" style="font-size:14px;color:${T.pageInk};background:#FFF1C9;border:2px solid #2A2238;border-radius:${T.fieldRadius};padding:8px 12px">${esc(s.pasteMsg)}</div>` : ''}
      <div style="border-top:${T.divider}"></div>
      <label style="display:flex;flex-direction:column;gap:6px"><span style="font-family:${T.head};font-size:16px;font-weight:700">Paste a list of names</span>
        <span style="font-size:13px;color:${T.pageMuted}">Copy the drug names from your syllabus or study guide (one per line, or separated by commas). Brand or generic names both work.</span>
        <textarea id="paste" rows="3" placeholder="lisinopril, Lipitor, metoprolol…" style="font-family:${T.body};font-size:15px;padding:10px 14px;border-radius:${T.btnRadius};border:${T.btnBorder};background:${T.btnBg};color:${T.btnFg};outline:none;resize:vertical">${esc(s.paste)}</textarea></label>
      <div>${small('Add these to the list', addPasted, false)}</div>
      <div style="border-top:${T.divider}"></div>
      <div style="font-family:${T.head};font-size:16px;font-weight:700">Or tick drugs one by one</div>
      <input id="lsearch" value="${esc(s.lsearch)}" placeholder="Search by name or class" aria-label="Search drugs to add" style="font-family:${T.body};font-size:16px;padding:12px 16px;border-radius:${T.btnRadius};border:${T.btnBorder};background:${T.btnBg};color:${T.btnFg};outline:none">
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${chipHtml(chip(s.lonly, () => setState({ lonly: !s.lonly }), 'Show only ticked'))}
        ${chipHtml(chip(false, () => bulkList(true), 'Tick all shown'))}
        ${chipHtml(chip(false, () => bulkList(false), 'Untick all shown'))}
      </div>
      <div id="lgrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px">${listGridHtml()}</div>
    </div>`;
  }
  return `
  <div style="max-width:900px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      ${lbl('My lists')}
      ${s.lists.map(x => chipHtml(chip(x.id === s.listEdit, () => setState({ listEdit: x.id, lsearch: '', lonly: false, paste: '', pasteMsg: '' }), listLabel(x), { id: 'lchip-' + x.id }))).join('')}
      ${s.lists.length ? chipHtml(chip(false, newList, '+ New list')) : ''}
    </div>
    ${body}
  </div>`;
}

function browseHtml(dk) {
  const s = state;
  const q = s.search.trim().toLowerCase();
  const rows = dk.filter(d => !q || [d.generic, d.brand, d.cls, ...d.ind].join(' ').toLowerCase().includes(q))
    .sort((a, b) => a.generic.localeCompare(b.generic));
  if (!rows.length) return `<div style="grid-column:1/-1;padding:30px;text-align:center;color:${T.pageMuted}">No drugs match “${esc(s.search)}”.</div>`;
  return rows.map(d => {
    const sy = SYS[d.sys];
    const badge = (l, dark) => ({ label: l, bg: dark ? '#111111' : sy.soft, fg: dark ? '#FFFFFF' : sy.color });
    const badges = [];
    if (d.cls) badges.push(badge(d.cls));
    if (d.route) badges.push(badge(d.route));
    if (d.controlled) badges.push(badge(d.ctrl, true));
    if (d.boxed) badges.push(badge('Boxed warning', true));
    if (d.rems) badges.push(badge('REMS', true));
    if (d.niosh) badges.push(badge('NIOSH', true));
    const weak = weakSkillsOf(d.id);
    if (weak.length) badges.push({ label: 'Weak: ' + weak.map(k => SKILLS[k].label).join(', '), bg: '#B42318', fg: '#FFFFFF' });
    return `
    <button ${on(() => setState({ mode: 'flash', idx: dk.indexOf(d), flipped: true }))} style="display:flex;flex-direction:column;gap:8px;text-align:left;padding:0;overflow:hidden;border-radius:${T.fieldRadiusLg};border:${T.cardBorder};background:#FFFFFF;color:${T.ink};box-shadow:${T.btnShadow};cursor:pointer;font-family:${T.body}">
      <div style="height:8px;width:100%;background:${sy.color}"></div>
      <div style="display:flex;flex-direction:column;gap:6px;padding:6px 16px 16px;width:100%">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">
          <span style="font-family:${T.head};font-size:19px;font-weight:700;line-height:1.15">${esc(d.generic)}</span>
          <span style="flex:none;font-family:${T.label};font-size:12px;font-weight:700">${esc(d.cpl)}</span>
        </div>
        ${d.brand ? `<div style="font-size:14px;opacity:.85">${esc(d.brand)}</div>` : ''}
        <div style="display:flex;flex-wrap:wrap;gap:6px">
          ${badges.map(b => `<span style="font-family:${T.label};font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;background:${b.bg};color:${b.fg}">${esc(b.label)}</span>`).join('')}
        </div>
      </div>
    </button>`;
  }).join('');
}

/* =====================================================================
   8. EVENTS — clicks, typing in search, keyboard shortcuts.
   ===================================================================== */
const app = document.getElementById('app');
app.addEventListener('click', e => {
  const el = e.target.closest('[data-h]');
  if (el && handlers[el.dataset.h]) handlers[el.dataset.h]();
});
app.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'search') {
    state.search = e.target.value;
    // Only redraw the results so the search box keeps its cursor.
    document.getElementById('browse-grid').innerHTML = browseHtml(deck());
  } else if (id === 'lsearch') {
    state.lsearch = e.target.value; refreshBuilder();
  } else if (id === 'paste') {
    state.paste = e.target.value;
  } else if (id === 'lname') {
    const l = curList(); if (l) { l.name = e.target.value.trim() || 'My list'; saveLists(); refreshBuilder(); }
  }
});
window.addEventListener('keydown', e => {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const { mode } = state;
  if (mode !== 'flash') return;
  if (e.code === 'Space') { e.preventDefault(); flip(); }
  if (state.flipped && ['1', '2', '3'].includes(e.key) && hasTier(+e.key)) setState({ backTier: +e.key });
  if (e.key === 'ArrowRight') step(1);
  if (e.key === 'ArrowLeft') step(-1);
});

render();
loadLiveData();
</script>
