<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rx Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
body{margin:0;-webkit-font-smoothing:antialiased;background:#FFF7EC}
*{box-sizing:border-box}
a{color:#6741D9}a:hover{color:#4C2BB0}
input::placeholder{color:#8A8296}
button{-webkit-tap-highlight-color:transparent}
.flipper{display:grid;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.75,.25,1);cursor:pointer}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden}
@media (max-width:560px){.wrap{padding:18px 14px 48px !important}.h1{font-size:32px !important}
  .front{min-height:300px !important}
  /* Keep the grading buttons on screen while scrolling a long card back */
  .gradebar{position:sticky;bottom:0;z-index:5;background:#FFF7EC;margin:0 -14px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:2px dashed #E3D9CC;flex-wrap:nowrap !important;gap:8px !important}
  .gradebar .gstatus,.gradebar .gsub{display:none}
  .gradebar .gbtn{min-width:0 !important;padding:10px 12px !important;font-size:15px !important}
  .gradebar .arrow{width:42px !important;height:42px !important}}
</style>
<!-- Backup copy of the drug data (used only if the Google Sheet can't be reached). -->
<script src="data/drugs-backup.js"></script>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   0. SETTINGS
   SHEET_ID is the long code in the Google Sheet's web address:
   docs.google.com/spreadsheets/d/<SHEET_ID>/edit
   ===================================================================== */
const SHEET_ID = '1MGGz9hqHF-PTv-Z35NzGfuIi7Hp5WAvj5cSWiv6emis';
const SHEET_TAB = 'Drugs';
const SHEET_EDIT_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/edit';
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&headers=1&sheet=' + encodeURIComponent(SHEET_TAB);

/* =====================================================================
   1. BODY SYSTEMS (card colors) and INFORMATION TIERS
   ===================================================================== */
const SYS = {
  endo:  { label: 'Endocrine',              color: '#C2255C', soft: '#FDE7EF' },
  cardio:{ label: 'Cardiovascular',         color: '#C2410C', soft: '#FDEBDD' },
  resp:  { label: 'Respiratory',            color: '#0B7285', soft: '#DDF2F5' },
  gi:    { label: 'GI',                     color: '#9A5B00', soft: '#FBEFD6' },
  cns:   { label: 'CNS',                    color: '#6741D9', soft: '#ECE6FD' },
  inf:   { label: 'Anti-infective',         color: '#237032', soft: '#E2F2E5' },
  heme:  { label: 'Hematologic',            color: '#1864AB', soft: '#E0ECF8' },
  msk:   { label: 'Pain & Musculoskeletal', color: '#862E9C', soft: '#F3E5F7' },
  gu:    { label: 'Renal & GU',             color: '#364FC7', soft: '#E5E9FB' },
  other: { label: 'Other',                  color: '#495057', soft: '#ECEEF0' },
};
const SYS_BY_LABEL = Object.fromEntries(Object.entries(SYS).map(([k, s]) => [s.label.toLowerCase(), k]));

const TIERS = {
  1: { name: 'Tier 1', desc: 'Basics', color: '#3B2F55' },
  2: { name: 'Tier 2', desc: 'Pharmacology', color: '#0B7285' },
  3: { name: 'Tier 3', desc: 'Safety & counseling', color: '#B42318' },
};

/* =====================================================================
   2. LOADING DRUG DATA
   The app shows the backup copy instantly, then swaps in the live
   Google Sheet data as soon as it arrives.
   ===================================================================== */
// Spreadsheet header -> field name. Matching ignores case, spaces and "(Tier n)".
const COLS = {
  generic: 'generic', brand: 'brand', drugclass: 'cls', bodysystem: 'sys', route: 'route',
  controlledsubstance: 'ctrl', cpl: 'cpl', fdaindication1: 'ind1', fdaindication2: 'ind2',
  mechanismofaction: 'moa', dosageforms: 'forms', monitoring: 'mon',
  boxedwarning: 'boxed', contraindications: 'contra', adverseeffects: 'ae', patientcounseling: 'coun',
  rems: 'rems', nioshhazardousdrug: 'niosh', niosh: 'niosh',
  facultyreviewed: 'reviewed',
};
const normHead = h => String(h).toLowerCase().replace(/\(.*?\)/g, '').replace(/[^a-z0-9]/g, '');
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

function buildDrugs(head, rows) {
  const idx = {};
  head.forEach((h, i) => { const f = COLS[normHead(h)]; if (f && !(f in idx)) idx[f] = i; });
  if (!('generic' in idx)) throw new Error('No "Generic" column found');
  const seen = new Set();
  const out = [];
  for (const r of rows) {
    const get = f => (f in idx ? String(r[idx[f]] == null ? '' : r[idx[f]]).trim() : '');
    const generic = get('generic');
    if (!generic) continue;
    const brand = get('brand');
    let id = slug(generic);
    if (seen.has(id)) id = slug(generic + ' ' + (brand || out.length));
    seen.add(id);
    const ctrl = get('ctrl') || 'Not Controlled';
    const route = get('route');
    out.push({
      id, generic, brand, cls: get('cls'), route,
      routeGroup: /^oral$/i.test(route) ? 'Oral' : /^injectable$/i.test(route) ? 'Injectable' : 'Other',
      sys: SYS_BY_LABEL[get('sys').toLowerCase()] || 'other',
      ctrl, controlled: !/^not/i.test(ctrl) && ctrl !== '',
      cpl: get('cpl').toUpperCase().replace(/\s+/g, ''),
      ind: [get('ind1'), get('ind2')].filter(Boolean),
      moa: get('moa'), forms: get('forms'), mon: get('mon'),
      boxed: /^(none|n\/a|-)?$/i.test(get('boxed')) ? '' : get('boxed'),
      contra: get('contra'), ae: get('ae'), coun: get('coun'),
      rems: get('rems'), niosh: get('niosh'),
      reviewed: /^y/i.test(get('reviewed')),
    });
  }
  return out;
}

// Reads CSV text (handles quotes, commas and line breaks inside cells).
function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}

let DRUGS = [];
let dataStatus = { source: 'backup', note: '' };
try {
  DRUGS = buildDrugs(window.RX_BACKUP.head, window.RX_BACKUP.rows);
  dataStatus = { source: 'backup', note: 'Loading the latest drug data…' };
} catch (e) {
  dataStatus = { source: 'none', note: 'Loading drug data…' };
}

async function loadLiveData() {
  try {
    const res = await fetch(SHEET_CSV_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const rows = parseCSV(await res.text());
    const live = buildDrugs(rows[0], rows.slice(1));
    if (!live.length) throw new Error('Sheet has no drugs');
    DRUGS = live;
    dataStatus = { source: 'live', note: '' };
  } catch (e) {
    const snap = window.RX_BACKUP && window.RX_BACKUP.snapshot;
    dataStatus = { source: DRUGS.length ? 'backup' : 'none',
      note: DRUGS.length ? 'Showing the saved copy of the drug data from ' + snap + ' (the live Google Sheet could not be reached).'
                         : 'Could not load the drug data. Check your internet connection and refresh.' };
  }
  state.srQueue = null;
  render();
}

/* =====================================================================
   3. LOOK — the "Sticker" style
   ===================================================================== */
const T = {
  page:'#FFF7EC', pageInk:'#2A2238', pageMuted:'#6B6178', ink:'#2A2238',
  head:"'Fredoka', sans-serif", body:"'Nunito', sans-serif", label:"'Fredoka', sans-serif",
  cardRadius:'26px', cardBorder:'3px solid #2A2238', cardShadow:'7px 7px 0 #2A2238',
  panelBg:'#FFFFFF', panelBorder:'2.5px solid #2A2238', panelRadius:'20px', divider:'2px dashed #E3D9CC',
  btnRadius:'14px', btnBorder:'2.5px solid #2A2238', btnBg:'#FFFFFF', btnFg:'#2A2238', btnShadow:'3px 3px 0 #2A2238',
  primaryBg:'#2A2238', primaryFg:'#FFF7EC',
  fieldPad:'12px 14px', fieldRadius:'14px', fieldRadiusLg:'18px',
};
const hash = s => { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
// Shrinks large text so its longest word fits on one line (never breaks a word in half).
const fitSize = (text, maxPx, sidePx) => {
  const longest = Math.max(1, ...String(text).split(/\s+/).map(w => w.length));
  return `min(${maxPx}px, calc((100vw - ${sidePx}px) / ${(longest * 0.64).toFixed(2)}))`;
};
const newSeed = () => Math.random().toString(36).slice(2);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

/* =====================================================================
   4. APP STATE
   Remembered in this browser: missed cards, chosen tiers, card front.
   ===================================================================== */
const store = {
  get(k, fallback) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? fallback : v; } catch (e) { return fallback; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const savedTiers = store.get('rxcards-tiers', [1, 2, 3]);
const state = {
  mode: 'flash',
  tiers: Array.isArray(savedTiers) && savedTiers.length ? savedTiers.filter(t => TIERS[t]) : [1, 2, 3],
  front: store.get('rxcards-front', 'Generic'),
  route: 'All', cpl: [], sys: [], ctrlOnly: false, boxedOnly: false, remsOnly: false, nioshOnly: false, missedOnly: false,
  idx: 0, flipped: false, missed: store.get('rxcards-missed', []), srQueue: null, search: '',
  qn: 0, picked: null, score: 0, total: 0,
  seed: newSeed(),   // card order is shuffled with this; the Shuffle button makes a new one
  backTier: null,    // which tier tab is open on the back of the card
  panelOpen: window.innerWidth >= 700,   // settings panel starts folded on phones
};
if (!Array.isArray(state.missed)) state.missed = [];

function setState(patch) {
  Object.assign(state, patch);
  if ('tiers' in patch) store.set('rxcards-tiers', state.tiers);
  if ('front' in patch) store.set('rxcards-front', state.front);
  render();
}
const hasTier = n => state.tiers.includes(n);
function deck() {
  const s = state;
  return DRUGS.filter(d =>
    (s.route === 'All' || d.routeGroup === s.route) &&
    (!s.cpl.length || s.cpl.includes(d.cpl)) &&
    (!s.sys.length || s.sys.includes(d.sys)) &&
    (!s.ctrlOnly || d.controlled) &&
    (!s.boxedOnly || !!d.boxed) &&
    (!s.remsOnly || !!d.rems) &&
    (!s.nioshOnly || !!d.niosh) &&
    (!s.missedOnly || s.missed.includes(d.id)))
    .sort((a, b) => hash(a.id + s.seed) - hash(b.id + s.seed));
}
function resetPos(extra = {}) { setState({ idx: 0, flipped: false, srQueue: null, qn: 0, picked: null, ...extra }); }
function step(n) { const len = deck().length || 1; setState({ idx: (state.idx + n + len) % len, flipped: false }); }
function setMissed(id, isMissed) {
  const set = new Set(state.missed); isMissed ? set.add(id) : set.delete(id);
  state.missed = [...set];
  store.set('rxcards-missed', state.missed);
}
function srGrade(grade, id) {
  const pos = { again: 1, hard: 3 }[grade];
  if (grade === 'again') setMissed(id, true);
  if (grade === 'good' || grade === 'easy') setMissed(id, false);
  const q = state.srQueue.slice(1);
  if (pos != null) q.splice(Math.min(pos, q.length), 0, id);
  setState({ srQueue: q, flipped: false });
}
function toggleTier(n) {
  const on = hasTier(n);
  if (on && state.tiers.length === 1) return; // keep at least one tier on
  const tiers = on ? state.tiers.filter(t => t !== n) : [...state.tiers, n].sort();
  setState({ tiers, flipped: state.flipped, picked: null });
}
/* Flipping only swaps the card's rotation, so the 3D animation plays smoothly. */
function flip() {
  state.flipped = !state.flipped;
  const el = document.getElementById('flipper');
  if (el) el.style.transform = state.flipped ? 'rotateY(180deg)' : 'rotateY(0deg)';
}

/* =====================================================================
   5. CARD CONTENT
   ===================================================================== */
function frontFor(d, idx) {
  let f = state.front;
  if (f === 'Random') f = ['Generic', 'Brand', 'Clues'][hash(d.id + idx) % 3];
  if (f === 'Brand' && d.brand) return { label: 'Brand name — what is the generic?', text: d.brand, sub: '' };
  if (f === 'Clues') return { label: 'Name the drug', text: d.cls || 'Drug', sub: [...d.ind, d.route].filter(Boolean).join(' · ') };
  return { label: 'Generic — recall the details', text: d.generic, sub: '' };
}

// The back of the card, grouped by information tier.
function backSections(d) {
  const sections = [];
  if (hasTier(1)) sections.push({ tier: 1, fields: [
    { label: 'Therapeutic class', text: d.cls },
    { label: 'FDA indication(s)', text: d.ind.join('; ') },
    { label: 'Controlled substance', text: d.ctrl },
  ].filter(f => f.text) });
  if (hasTier(2)) sections.push({ tier: 2, fields: [
    { label: 'Mechanism of action', text: d.moa },
    { label: 'Dosage forms', text: d.forms },
    { label: 'Monitoring', text: d.mon },
  ].filter(f => f.text) });
  if (hasTier(3)) sections.push({ tier: 3, boxed: d.boxed, fields: [
    { label: 'REMS program', text: d.rems },
    { label: 'NIOSH hazardous drug', text: d.niosh },
    { label: 'Contraindications', text: d.contra },
    { label: 'Adverse effects', text: d.ae },
    { label: 'Patient counseling', text: d.coun },
  ].filter(f => f.text) });
  return sections;
}

/* =====================================================================
   6. QUIZ — only asks about the tiers that are switched on
   ===================================================================== */
// Words that are part of salt/formulation names, ignored when checking if a text "gives away" a drug name.
const NAME_STOP = new Set('sodium hydrochloride calcium potassium sulfate magnesium chloride acetate tartrate succinate maleate besylate phosphate citrate mesylate bromide fumarate bitartrate acetonide propionate dihydrate trihydrate monohydrate crystalline hyclate oxalate hydrobromide dimesylate xinafoate furoate recombinant origin extended release topical inhalation nasal transdermal tablets'.split(' '));
const nameWords = d => (String(d.generic + ' ' + d.brand).toLowerCase().match(/[a-z]{5,}/g) || []).filter(w => !NAME_STOP.has(w));
const mentions = (text, d) => { const t = String(text).toLowerCase(); return nameWords(d).some(w => t.includes(w)); };
const wordSet = t => new Set(String(t).toLowerCase().match(/[a-z0-9]{4,}/g) || []);
// Share of words two texts have in common (0 = nothing alike, 1 = same words).
const similarity = (a, b) => { const A = wordSet(a), B = wordSet(b); let n = 0; for (const w of A) if (B.has(w)) n++; return n / Math.max(1, Math.min(A.size, B.size)); };
const onlyHypersensitivity = t => /^(none\.?|hypersensitivity[^;]*\.?)$/i.test(String(t).trim());

/* Each Tier 2/3 field is asked both ways:
   "forward"  = show the information, pick the drug;
   "reverse"  = show the drug, pick the information. */
const QUIZ_FIELDS = [
  { f: 'moa',    tier: 2, fwd: 'Which drug works this way?',              inv: 'How does this drug work?' },
  { f: 'mon',    tier: 2, fwd: 'Which drug needs this monitoring?',       inv: 'What should be monitored?' },
  { f: 'forms',  tier: 2, fwd: null,                                      inv: 'Which dosage forms are available?' },
  { f: 'boxed',  tier: 3, fwd: 'Which drug carries this boxed warning?',  inv: 'What is its boxed warning?' },
  { f: 'contra', tier: 3, fwd: null,                                      inv: 'What are its contraindications?' },
  { f: 'ae',     tier: 3, fwd: 'Which drug has these common adverse effects?', inv: 'What are its common adverse effects?' },
  { f: 'coun',   tier: 3, fwd: 'Which drug goes with this counseling?',   inv: 'Which counseling points go with it?' },
];
const usable = (x, f) => x[f] && !(f === 'contra' && onlyHypersensitivity(x[f]));
const QUIZ_TYPES = [
  { tier: 1, q: 'Which drug class?', stem: d => d.generic, ans: d => d.cls, need: d => d.cls,
    ok: (x, d) => x.sys !== d.sys },
  { tier: 1, q: 'What is the generic name?', stem: d => d.brand, ans: d => d.generic, need: d => d.brand,
    ok: (x, d) => x.generic !== d.generic },
  { tier: 1, q: 'Primary FDA indication?', stem: d => d.generic, ans: d => d.ind[0], need: d => d.ind[0],
    ok: (x, d) => x.sys !== d.sys && !d.ind.includes(x.ind[0]) },
  ...QUIZ_FIELDS.filter(F => F.fwd).map(F => ({
    tier: F.tier, q: F.fwd, stem: d => d[F.f], ans: d => d.generic,
    need: d => usable(d, F.f) && !mentions(d[F.f], d),
    ok: (x, d) => x.generic !== d.generic && x.cls !== d.cls && (!x[F.f] || similarity(x[F.f], d[F.f]) < 0.5),
  })),
  ...QUIZ_FIELDS.map(F => ({
    tier: F.tier, q: F.inv, reverse: true, stem: d => d.generic, sub: d => d.brand, ans: d => d[F.f],
    need: d => usable(d, F.f) && !mentions(d[F.f], d),
    ok: (x, d) => usable(x, F.f) && x.cls !== d.cls && !mentions(x[F.f], x) && !mentions(x[F.f], d) &&
                  similarity(x[F.f], d[F.f]) < 0.35,
  })),
];
function quiz(dk) {
  const s = state;
  // Find the next drug (from position qn) that has a question in the chosen tiers.
  let d = null, types = [];
  for (let k = 0; k < dk.length; k++) {
    const cand = dk[(s.qn + k) % dk.length];
    const t = QUIZ_TYPES.filter(x => hasTier(x.tier) && x.need(cand));
    if (t.length) { d = cand; types = t; break; }
  }
  if (!d) return null;
  const ty = types[hash(d.id + s.qn + s.seed) % types.length];
  const correct = ty.ans(d);
  // Wrong answers: never true for this drug (different class, different wording),
  // and drawn from the same body system first so they look plausible.
  const seen = new Set([correct]), pool = [];
  DRUGS.filter(x => x.id !== d.id && ty.ans(x) && ty.ok(x, d))
    .map(x => ({ x, rank: (x.sys === d.sys ? 0 : 1) * 1e10 + hash(x.id + d.id + s.seed + s.qn) }))
    .sort((a, b) => a.rank - b.rank)
    .forEach(({ x }) => { const v = ty.ans(x); if (pool.length < 3 && !seen.has(v)) { seen.add(v); pool.push(v); } });
  const opts = [correct, ...pool].sort((a, b) => hash(b + s.seed + s.qn) - hash(a + s.seed + s.qn));
  const answered = s.picked != null;
  const sy = SYS[d.sys];
  const options = opts.map((o, i) => {
    const isRight = o === correct, isPicked = s.picked === o;
    let bg = T.btnBg, fg = T.btnFg, keyBg = sy.soft, keyFg = sy.color;
    if (answered && isRight) { bg = '#237032'; fg = '#FFFFFF'; keyBg = '#FFFFFF'; keyFg = '#237032'; }
    else if (answered && isPicked) { bg = '#B42318'; fg = '#FFFFFF'; keyBg = '#FFFFFF'; keyFg = '#B42318'; }
    return { label: o, key: 'ABCD'[i], bg, fg, keyBg, keyFg,
      onClick: () => { if (answered) return; setMissed(d.id, !isRight); setState({ picked: o, total: s.total + 1, score: s.score + (isRight ? 1 : 0) }); } };
  });
  const stem = ty.stem(d);
  return {
    d, sy, tier: ty.tier, question: ty.q, stem, sub: ty.sub ? ty.sub(d) : '', stemSize: stem.length > 140 ? '20px' : stem.length > 60 ? '24px' : '38px',
    options, answered, score: s.score, total: s.total,
    feedback: !answered ? '' : s.picked === correct ? 'Correct.' : ty.reverse ? 'Not quite. The correct answer is shown in green.' : 'Answer: ' + correct,
    reveal: answered ? d.generic + (d.brand ? ' (' + d.brand + ')' : '') : '',
    next: () => setState({ qn: (dk.indexOf(d) + 1), picked: null }),
  };
}

/* =====================================================================
   7. DRAWING THE SCREEN
   Each button gets a numbered click handler (data-h="n").
   ===================================================================== */
let handlers = [];
const on = fn => { handlers.push(fn); return 'data-h="' + (handlers.length - 1) + '"'; };

function chip(active, onClick, label, extra = {}) {
  return { label, onClick, bg: active ? T.pageInk : 'transparent', fg: active ? T.page : T.pageInk, border: '2px solid #2A2238', ...extra };
}
function chipHtml(c, size = '6px 12px') {
  const dot = c.dot ? `<span style="width:11px;height:11px;border-radius:50%;background:${c.dot};border:1.5px solid #2A2238"></span>` : '';
  const layout = c.dot ? 'display:flex;align-items:center;gap:7px;padding:6px 12px 6px 9px;' : `padding:${size};`;
  return `<button ${on(c.onClick)} aria-pressed="${c.bg !== 'transparent'}" style="${layout}font-family:${T.label};font-size:13px;font-weight:600;border-radius:999px;border:${c.border};background:${c.bg};color:${c.fg};cursor:pointer">${dot}${esc(c.label)}</button>`;
}
const lbl = (text, minW) => `<span style="font-family:${T.label};font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:${T.pageMuted}${minW ? ';min-width:44px' : ''}">${text}</span>`;
const tierBadge = (n, dark) => `<span style="flex:none;font-family:${T.label};font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:${dark ? '#FFFFFF' : TIERS[n].color};color:${dark ? TIERS[n].color : '#FFFFFF'}">${TIERS[n].name}</span>`;

function tierPicker() {
  return `
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    ${lbl('Study')}
    ${[1, 2, 3].map(n => {
      const active = hasTier(n), t = TIERS[n];
      return `<button ${on(() => toggleTier(n))} aria-pressed="${active}" title="${active && state.tiers.length === 1 ? 'At least one tier must stay on' : ''}" style="display:flex;align-items:center;gap:8px;font-family:${T.label};font-size:14px;font-weight:600;padding:7px 14px 7px 8px;border-radius:999px;border:2px solid #2A2238;background:${active ? t.color : '#FFFFFF'};color:${active ? '#FFFFFF' : T.pageInk};cursor:pointer">
        <span style="display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:${active ? '#FFFFFF' : 'transparent'};border:2px solid ${active ? '#FFFFFF' : '#2A2238'};color:${t.color};font-size:13px;line-height:1">${active ? '✓' : ''}</span>
        ${t.name} <span style="font-weight:500;opacity:.9">· ${t.desc}</span></button>`;
    }).join('')}
  </div>`;
}

function cardBack(d, sy) {
  const draft = (hasTier(2) || hasTier(3)) && !d.reviewed;
  const all = backSections(d);
  // Show one tier at a time; tabs switch between the tiers that are turned on.
  const openTier = all.some(x => x.tier === state.backTier) ? state.backTier : all[0].tier;
  const sections = all.filter(x => x.tier === openTier);
  const tabs = all.length < 2 ? '' : `
      <div role="tablist" aria-label="Information tier" style="display:flex;gap:6px;flex-wrap:wrap">
        ${all.map(x => {
          const active = x.tier === openTier, t = TIERS[x.tier];
          return `<button role="tab" aria-selected="${active}" ${on(() => setState({ backTier: x.tier }))} style="flex:1 1 auto;font-family:${T.label};font-size:14px;font-weight:600;padding:8px 12px;border-radius:12px;border:2px solid #2A2238;background:${active ? t.color : '#FFFFFF'};color:${active ? '#FFFFFF' : T.pageInk};box-shadow:${active ? 'none' : '2px 2px 0 #2A2238'};cursor:pointer">${t.name} <span style="font-weight:500;opacity:.9">· ${t.desc}</span></button>`;
        }).join('')}
      </div>`;
  const fieldBox = f => `
    <div style="display:flex;flex-direction:column;gap:5px;padding:${T.fieldPad};border-radius:${T.fieldRadius};background:${sy.soft}">
      <div style="font-family:${T.label};font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:${sy.color}">${esc(f.label)}</div>
      <div style="font-size:15px;line-height:1.5;text-wrap:pretty;color:${T.ink}">${esc(f.text)}</div>
    </div>`;
  return `
  <div class="face" style="transform:rotateY(180deg);display:flex;flex-direction:column;border-radius:${T.cardRadius};border:${T.cardBorder};box-shadow:${T.cardShadow};background:#FFFFFF;color:${T.ink};overflow:hidden">
    <div style="display:flex;flex-direction:column;gap:8px;padding:22px 28px 20px;background:${sy.color};color:#FFFFFF;border-bottom:3px solid #2A2238">
      <div style="font-family:${T.label};font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.92">${esc(sy.label)}${d.route ? ' · ' + esc(d.route) : ''}</div>
      <h2 style="margin:0;font-family:${T.head};font-size:${fitSize(d.generic, 34, 100)};line-height:1.05;font-weight:700;overflow-wrap:normal;word-break:normal">${esc(d.generic)}</h2>
      ${d.brand ? `<div style="font-size:17px;font-weight:600">${esc(d.brand)}</div>` : ''}
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">
        ${d.cpl ? `<span style="font-family:${T.label};font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:#FFFFFF;color:#2A2238;border:2px solid #2A2238">${esc(d.cpl)}</span>` : ''}
        ${hasTier(1) && d.controlled ? `<span style="font-family:${T.label};font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:#111111;color:#FFFFFF;border:2px solid #2A2238">${esc(d.ctrl)}</span>` : ''}
        ${hasTier(3) && d.rems ? `<span style="font-family:${T.label};font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:#FFFFFF;color:#B42318;border:2px solid #B42318">REMS</span>` : ''}
        ${hasTier(3) && d.niosh ? `<span style="font-family:${T.label};font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:#FFFFFF;color:#B42318;border:2px solid #B42318">NIOSH</span>` : ''}
        ${draft ? `<span style="font-family:${T.label};font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:#FFE8A3;color:#5C3D00;border:2px solid #2A2238">Draft · not yet faculty reviewed</span>` : ''}
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:18px;padding:20px 24px 24px">
      ${tabs}
      ${sections.map(sec => `
      <div style="display:flex;flex-direction:column;gap:10px">
        ${all.length > 1 ? '' : `<div style="display:flex;align-items:center;gap:8px">${tierBadge(sec.tier)}<span style="font-family:${T.label};font-size:13px;font-weight:700;color:${T.pageMuted}">${TIERS[sec.tier].desc}</span><span style="flex:1;border-top:${T.divider}"></span></div>`}
        ${sec.boxed ? `
        <div style="border:2.5px solid #111;background:#FFFFFF;color:#111;padding:12px 16px;border-radius:4px;display:flex;flex-direction:column;gap:4px">
          <div style="font-family:${T.label};font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase">Boxed warning</div>
          <div style="font-size:15px;line-height:1.45;font-weight:600">${esc(sec.boxed)}</div>
        </div>` : (sec.tier === 3 ? `<div style="font-family:${T.label};font-size:13px;color:${T.pageMuted}">No boxed warning.</div>` : '')}
        ${sec.fields.length ? `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px">${sec.fields.map(fieldBox).join('')}</div>` : ''}
        ${!sec.fields.length && !sec.boxed && sec.tier !== 3 ? `<div style="font-size:14px;color:${T.pageMuted}">No ${TIERS[sec.tier].name} information entered yet.</div>` : ''}
      </div>`).join('')}
      <div style="font-family:${T.label};font-size:12px;color:${T.pageMuted};padding-top:2px">Condensed from FDA labeling for study. Verify against current DailyMed before clinical use.</div>
    </div>
  </div>`;
}

function render() {
  handlers = [];
  const s = state;
  const dk = deck();
  const toggleIn = (key, v) => () => resetPos({ [key]: s[key].includes(v) ? s[key].filter(x => x !== v) : [...s[key], v] });

  // Which card is showing?
  let cur = null, position = '', statusLabel = '', srDone = false;
  if (s.mode === 'flash' && dk.length) {
    const i = s.idx % dk.length; cur = dk[i]; position = (i + 1) + ' of ' + dk.length;
    statusLabel = position + (s.missed.length ? ' · ' + s.missed.length + ' missed' : '');
  }
  if (s.mode === 'sr' && dk.length) {
    if (!s.srQueue) s.srQueue = dk.map(d => d.id);
    const q = s.srQueue.filter(id => DRUGS.some(d => d.id === id));
    s.srQueue = q;
    if (q.length) { cur = DRUGS.find(d => d.id === q[0]); position = 'Review'; statusLabel = q.length + ' due this session'; }
    else srDone = true;
  }

  let gradeBtns = [];
  if (cur && s.mode === 'flash') gradeBtns = [
    { label: 'Missed it', sub: 'add to missed', bg: '#B42318', fg: '#FFFFFF', onClick: () => { setMissed(cur.id, true); step(1); } },
    { label: 'Got it', sub: 'next card', bg: '#237032', fg: '#FFFFFF', onClick: () => { setMissed(cur.id, false); step(1); } },
  ];
  if (cur && s.mode === 'sr') gradeBtns = [
    { label: 'Again', sub: '< 1 min', bg: '#B42318', fg: '#FFFFFF', onClick: () => srGrade('again', cur.id) },
    { label: 'Hard', sub: '~6 min', bg: T.btnBg, fg: T.btnFg, onClick: () => srGrade('hard', cur.id) },
    { label: 'Good', sub: '1 day', bg: '#237032', fg: '#FFFFFF', onClick: () => srGrade('good', cur.id) },
    { label: 'Easy', sub: '4 days', bg: '#1864AB', fg: '#FFFFFF', onClick: () => srGrade('easy', cur.id) },
  ];

  const modes = [['flash', 'Flip & grade'], ['quiz', 'Quiz'], ['sr', 'Spaced review'], ['browse', 'Browse']];
  const showFrontPicker = s.mode === 'flash' || s.mode === 'sr';

  // ---------- Header, mode tabs, tier picker, filter panel ----------
  let html = `
<div style="min-height:100vh;background:${T.page};color:${T.pageInk};font-family:${T.body}">
  <div class="wrap" style="max-width:1120px;margin:0 auto;padding:28px 24px 64px;display:flex;flex-direction:column;gap:20px">
    <header style="display:flex;flex-direction:column;gap:4px">
      <div style="font-family:${T.label};font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:${T.pageMuted}">Sigler's Top 250 · Oral &amp; Injectable</div>
      <h1 class="h1" style="margin:0;font-family:${T.head};font-size:40px;line-height:1.05;font-weight:700;letter-spacing:-.01em">Rx Flashcards</h1>
    </header>

    <nav style="display:flex;gap:8px;flex-wrap:wrap">
      ${modes.map(([k, l]) => {
        const active = s.mode === k;
        return `<button ${on(() => setState({ mode: k, flipped: false, srQueue: null }))} style="font-family:${T.head};font-size:16px;font-weight:600;padding:10px 18px;border-radius:${T.btnRadius};border:${T.btnBorder};background:${active ? T.primaryBg : T.btnBg};color:${active ? T.primaryFg : T.btnFg};box-shadow:${active ? 'none' : T.btnShadow};cursor:pointer">${l}</button>`;
      }).join('')}
    </nav>

    <section style="display:flex;flex-direction:column;gap:12px;padding:16px 18px;border-radius:${T.panelRadius};background:${T.panelBg};border:${T.panelBorder}">
      <button ${on(() => setState({ panelOpen: !s.panelOpen }))} aria-expanded="${s.panelOpen}" style="display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:0;background:none;border:none;cursor:pointer;color:${T.pageInk};text-align:left">
        <span style="display:flex;flex-direction:column;gap:2px">
          <span style="font-family:${T.head};font-size:17px;font-weight:700">Study settings &amp; filters</span>
          <span style="font-family:${T.label};font-size:13px;color:${T.pageMuted}">${state.tiers.map(n => TIERS[n].name).join(' + ')} · ${dk.length + (dk.length === 1 ? ' card' : ' cards')}</span>
        </span>
        <span style="flex:none;font-family:${T.label};font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;border:2px solid #2A2238">${s.panelOpen ? 'Hide ▲' : 'Show ▼'}</span>
      </button>
      ${s.panelOpen ? `<div style="border-top:${T.divider}"></div>
      ${tierPicker()}
      <div style="border-top:${T.divider}"></div>
      <div style="display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center">
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          ${lbl('Route', true)}
          ${[['All', 'All'], ['Oral', 'Oral'], ['Injectable', 'Injectable'], ['Other', 'Other routes']].map(([r, l]) => chipHtml(chip(s.route === r, () => resetPos({ route: r }), l))).join('')}
        </div>
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          ${lbl('CPL')}
          ${['CPL1', 'CPL2', 'CPL3', 'CPL4', 'CPL5'].map(c => chipHtml(chip(s.cpl.includes(c), toggleIn('cpl', c), c.replace('CPL', '')), '6px 11px')).join('')}
        </div>
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          ${chipHtml(chip(s.ctrlOnly, () => resetPos({ ctrlOnly: !s.ctrlOnly }), 'Controlled only'))}
          ${chipHtml(chip(s.boxedOnly, () => resetPos({ boxedOnly: !s.boxedOnly }), 'Boxed warning'))}
          ${chipHtml(chip(s.remsOnly, () => resetPos({ remsOnly: !s.remsOnly }), 'REMS'))}
          ${chipHtml(chip(s.nioshOnly, () => resetPos({ nioshOnly: !s.nioshOnly }), 'NIOSH hazardous'))}
          ${chipHtml(chip(s.missedOnly, () => resetPos({ missedOnly: !s.missedOnly }), 'My missed (' + s.missed.length + ')'))}
        </div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        ${lbl('Class', true)}
        ${Object.entries(SYS).map(([k, sy]) => chipHtml(chip(s.sys.includes(k), toggleIn('sys', k), sy.label, { dot: sy.color }))).join('')}
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-top:${T.divider};padding-top:12px">
        ${showFrontPicker ? `
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          ${lbl('Card front')}
          ${['Generic', 'Brand', 'Clues', 'Random'].map(f => chipHtml(chip(s.front === f, () => setState({ front: f, flipped: false }), f))).join('')}
        </div>` : ''}
        <div style="display:flex;gap:12px;align-items:center;margin-left:auto">
          <span style="font-family:${T.label};font-size:14px;font-weight:700">${dk.length + (dk.length === 1 ? ' card' : ' cards')}</span>
          ${s.mode !== 'browse' ? `<button ${on(() => resetPos({ seed: newSeed() }))} style="font-family:${T.label};font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;border:2px solid #2A2238;background:#FFFFFF;color:${T.pageInk};cursor:pointer">⇄ Shuffle</button>` : ''}
          <button ${on(() => resetPos({ route: 'All', cpl: [], sys: [], ctrlOnly: false, boxedOnly: false, remsOnly: false, nioshOnly: false, missedOnly: false }))} style="font-family:${T.label};font-size:13px;background:none;border:none;color:${T.pageMuted};text-decoration:underline;cursor:pointer;padding:0">Clear filters</button>
        </div>
      </div>
      ` : ''}
    </section>`;

  if (dataStatus.note) {
    html += `<div role="status" style="font-family:${T.label};font-size:13px;color:${T.pageMuted};text-align:center">${esc(dataStatus.note)}</div>`;
  }

  if (!dk.length && DRUGS.length) {
    html += `<div style="padding:60px 20px;text-align:center;font-family:${T.head};font-size:22px;color:${T.pageMuted}">No cards match these filters.</div>`;
  }

  // ---------- Flashcard (Flip & grade, Spaced review) ----------
  if (showFrontPicker && dk.length) {
    html += `<div style="display:flex;flex-direction:column;gap:18px;align-items:stretch;max-width:780px;width:100%;margin:0 auto">`;
    if (srDone) {
      html += `
      <div style="padding:60px 24px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;border-radius:${T.cardRadius};border:${T.cardBorder};background:${T.panelBg}">
        <div style="font-family:${T.head};font-size:28px;font-weight:700">Review session complete</div>
        <div style="font-size:16px;color:${T.pageMuted}">Every card in this deck was rated Good or Easy.</div>
        <button ${on(() => setState({ srQueue: null, flipped: false }))} style="font-family:${T.head};font-size:16px;font-weight:600;padding:12px 20px;border-radius:${T.btnRadius};border:${T.btnBorder};background:${T.primaryBg};color:${T.primaryFg};box-shadow:${T.btnShadow};cursor:pointer">Start again</button>
      </div>`;
    }
    if (cur) {
      const sy = SYS[cur.sys], fr = frontFor(cur, s.idx);
      html += `
      <div style="perspective:1800px">
        <div id="flipper" class="flipper" ${on(flip)} style="transform:${s.flipped ? 'rotateY(180deg)' : 'rotateY(0deg)'}">
          <div class="face front" style="min-height:440px;display:flex;flex-direction:column;border-radius:${T.cardRadius};border:${T.cardBorder};box-shadow:${T.cardShadow};background:${sy.soft};color:${T.ink};overflow:hidden">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:20px 24px 0;flex-wrap:wrap">
              <span style="font-family:${T.label};font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:999px;background:${sy.color};color:#FFFFFF;border:2px solid #2A2238">${esc(sy.label)}</span>
              <span style="font-family:${T.label};font-size:13px;font-weight:600;color:${T.pageMuted}">${cur.route ? esc(cur.route) + ' · ' : ''}Card ${esc(position)}</span>
            </div>
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px 32px;text-align:center">
              <div style="font-family:${T.label};font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:${sy.color}">${esc(fr.label)}</div>
              <div style="font-family:${T.head};font-size:${fitSize(fr.text, fr.text.length > 26 ? 38 : 48, 110)};font-weight:700;line-height:1.1;text-wrap:balance;max-width:620px;overflow-wrap:normal;word-break:normal;hyphens:manual">${esc(fr.text)}</div>
              <div style="font-size:18px;line-height:1.45;max-width:560px;text-wrap:pretty;color:${T.pageMuted}">${esc(fr.sub)}</div>
            </div>
            <div style="padding:0 24px 20px;text-align:center;font-family:${T.label};font-size:13px;color:${T.pageMuted}">Click or press Space to flip · showing ${state.tiers.map(n => TIERS[n].name).join(', ')}</div>
          </div>
          ${cardBack(cur, sy)}
        </div>
      </div>

      <div class="gradebar" style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between">
        <div style="display:flex;gap:8px;align-items:center">
          ${s.mode === 'flash' ? `
          <div style="display:flex;gap:8px;align-items:center">
            ${[['←', -1, 'Previous card'], ['→', 1, 'Next card']].map(([ch, n, aria]) => `<button ${on(() => step(n))} aria-label="${aria}" class="arrow" style="font-family:${T.head};font-size:16px;font-weight:600;width:46px;height:46px;border-radius:${T.btnRadius};border:${T.btnBorder};background:${T.btnBg};color:${T.btnFg};box-shadow:${T.btnShadow};cursor:pointer">${ch}</button>`).join('')}
          </div>` : ''}
          <span class="gstatus" style="font-family:${T.label};font-size:14px;font-weight:600;color:${T.pageMuted}">${esc(statusLabel)}</span>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${gradeBtns.map(g => `<button class="gbtn" ${on(g.onClick)} style="display:flex;flex-direction:column;align-items:center;gap:1px;min-width:92px;font-family:${T.head};font-size:16px;font-weight:600;padding:10px 16px;border-radius:${T.btnRadius};border:${T.btnBorder};background:${g.bg};color:${g.fg};box-shadow:${T.btnShadow};cursor:pointer">${esc(g.label)}<span class="gsub" style="font-family:${T.label};font-size:11px;font-weight:600;opacity:.85">${esc(g.sub)}</span></button>`).join('')}
        </div>
      </div>`;
    }
    html += `</div>`;
  }

  // ---------- Quiz ----------
  if (s.mode === 'quiz' && dk.length) {
    const q = quiz(dk);
    if (!q) {
      html += `<div style="padding:60px 20px;text-align:center;font-family:${T.head};font-size:22px;color:${T.pageMuted}">No quiz questions for these cards in the tiers you picked. Try turning on another tier.</div>`;
    } else {
      const sy = q.sy;
      html += `
    <div style="max-width:780px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;flex-direction:column;border-radius:${T.cardRadius};border:${T.cardBorder};box-shadow:${T.cardShadow};background:${sy.soft};color:${T.ink};overflow:hidden">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:20px 24px 0;flex-wrap:wrap">
          <span style="display:flex;gap:8px;align-items:center"><span style="font-family:${T.label};font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:999px;background:${sy.color};color:#FFFFFF;border:2px solid #2A2238">${esc(sy.label)}</span>${tierBadge(q.tier)}</span>
          <span style="font-family:${T.label};font-size:14px;font-weight:700">Score ${q.score} / ${q.total}</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px;padding:26px 28px 30px">
          <div style="font-family:${T.label};font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:${sy.color}">${esc(q.question)}</div>
          <div style="font-family:${T.head};font-size:${q.stem.length > 60 ? q.stemSize : fitSize(q.stem, parseInt(q.stemSize), 110)};font-weight:700;line-height:1.25;text-wrap:pretty">${esc(q.stem)}</div>
          ${q.sub ? `<div style="font-size:18px;font-weight:600;color:${T.pageMuted}">${esc(q.sub)}</div>` : ''}
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:10px">
        ${q.options.map(o => `<button ${on(o.onClick)} style="display:flex;align-items:center;gap:12px;text-align:left;font-family:${T.body};font-size:${o.label.length > 70 ? 15 : 17}px;font-weight:600;line-height:1.35;padding:16px 18px;border-radius:${T.btnRadius};border:${T.btnBorder};background:${o.bg};color:${o.fg};box-shadow:${T.btnShadow};cursor:pointer"><span style="flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;font-family:${T.label};font-size:14px;font-weight:800;background:${o.keyBg};color:${o.keyFg}">${o.key}</span><span>${esc(o.label)}</span></button>`).join('')}
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;min-height:48px">
        <span style="display:flex;flex-direction:column;gap:2px"><span style="font-family:${T.head};font-size:18px;font-weight:600">${esc(q.feedback)}</span>${q.answered ? `<span style="font-size:14px;color:${T.pageMuted}">Card: ${esc(q.reveal)}</span>` : ''}</span>
        ${q.answered ? `<button ${on(q.next)} style="font-family:${T.head};font-size:16px;font-weight:600;padding:12px 22px;border-radius:${T.btnRadius};border:${T.btnBorder};background:${T.primaryBg};color:${T.primaryFg};box-shadow:${T.btnShadow};cursor:pointer">Next question →</button>` : ''}
      </div>
    </div>`;
    }
  }

  // ---------- Browse ----------
  if (s.mode === 'browse' && dk.length) {
    html += `
    <div style="display:flex;flex-direction:column;gap:14px">
      <input id="search" value="${esc(s.search)}" placeholder="Search generic, brand, class, or indication" aria-label="Search drugs" style="width:100%;font-family:${T.body};font-size:17px;padding:14px 18px;border-radius:${T.btnRadius};border:${T.btnBorder};background:${T.btnBg};color:${T.btnFg};box-shadow:${T.btnShadow};outline:none">
      <div id="browse-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px">${browseHtml(dk)}</div>
    </div>`;
  }

  // ---------- Footer ----------
  html += `
    <footer style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;font-family:${T.label};font-size:13px;color:${T.pageMuted}">
      <span>${DRUGS.length} drugs · ${dataStatus.source === 'live' ? 'live from the faculty Google Sheet' : 'saved copy'}</span>
      <a href="${SHEET_EDIT_URL}" target="_blank" rel="noopener">Faculty: edit drug data</a>
    </footer>`;

  html += `</div></div>`;

  const searchFocused = document.activeElement && document.activeElement.id === 'search';
  document.getElementById('app').innerHTML = html;
  if (searchFocused) { const el = document.getElementById('search'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

function browseHtml(dk) {
  const s = state;
  const q = s.search.trim().toLowerCase();
  const rows = dk.filter(d => !q || [d.generic, d.brand, d.cls, ...d.ind].join(' ').toLowerCase().includes(q))
    .sort((a, b) => a.generic.localeCompare(b.generic));
  if (!rows.length) return `<div style="grid-column:1/-1;padding:30px;text-align:center;color:${T.pageMuted}">No drugs match “${esc(s.search)}”.</div>`;
  return rows.map(d => {
    const sy = SYS[d.sys];
    const badge = (l, dark) => ({ label: l, bg: dark ? '#111111' : sy.soft, fg: dark ? '#FFFFFF' : sy.color });
    const badges = [];
    if (d.cls) badges.push(badge(d.cls));
    if (d.route) badges.push(badge(d.route));
    if (d.controlled) badges.push(badge(d.ctrl, true));
    if (d.boxed) badges.push(badge('Boxed warning', true));
    if (d.rems) badges.push(badge('REMS', true));
    if (d.niosh) badges.push(badge('NIOSH', true));
    if (s.missed.includes(d.id)) badges.push({ label: 'Missed', bg: '#B42318', fg: '#FFFFFF' });
    return `
    <button ${on(() => setState({ mode: 'flash', idx: dk.indexOf(d), flipped: true }))} style="display:flex;flex-direction:column;gap:8px;text-align:left;padding:0;overflow:hidden;border-radius:${T.fieldRadiusLg};border:${T.cardBorder};background:#FFFFFF;color:${T.ink};box-shadow:${T.btnShadow};cursor:pointer;font-family:${T.body}">
      <div style="height:8px;width:100%;background:${sy.color}"></div>
      <div style="display:flex;flex-direction:column;gap:6px;padding:6px 16px 16px;width:100%">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">
          <span style="font-family:${T.head};font-size:19px;font-weight:700;line-height:1.15">${esc(d.generic)}</span>
          <span style="flex:none;font-family:${T.label};font-size:12px;font-weight:700">${esc(d.cpl)}</span>
        </div>
        ${d.brand ? `<div style="font-size:14px;opacity:.85">${esc(d.brand)}</div>` : ''}
        <div style="display:flex;flex-wrap:wrap;gap:6px">
          ${badges.map(b => `<span style="font-family:${T.label};font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;background:${b.bg};color:${b.fg}">${esc(b.label)}</span>`).join('')}
        </div>
      </div>
    </button>`;
  }).join('');
}

/* =====================================================================
   8. EVENTS — clicks, typing in search, keyboard shortcuts.
   ===================================================================== */
const app = document.getElementById('app');
app.addEventListener('click', e => {
  const el = e.target.closest('[data-h]');
  if (el && handlers[el.dataset.h]) handlers[el.dataset.h]();
});
app.addEventListener('input', e => {
  if (e.target.id !== 'search') return;
  state.search = e.target.value;
  // Only redraw the results so the search box keeps its cursor.
  document.getElementById('browse-grid').innerHTML = browseHtml(deck());
});
window.addEventListener('keydown', e => {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const { mode } = state;
  if (mode !== 'flash' && mode !== 'sr') return;
  if (e.code === 'Space') { e.preventDefault(); flip(); }
  if (state.flipped && ['1', '2', '3'].includes(e.key) && hasTier(+e.key)) setState({ backTier: +e.key });
  if (mode === 'flash' && e.key === 'ArrowRight') step(1);
  if (mode === 'flash' && e.key === 'ArrowLeft') step(-1);
});

render();
loadLiveData();
</script>
</body>
</html>
